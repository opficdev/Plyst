name: iOS CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: SwiftLint
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up SwiftLint
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Lint
        run: make lint

  build:
    name: Build
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: make build

  test-build:
    name: Test Build
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build tests
        run: make test-build
