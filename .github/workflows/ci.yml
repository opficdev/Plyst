name: iOS CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: SwiftLint
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up SwiftLint
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Lint
        run: make lint

  xcode:
    # fail-fast로 한쪽이 실패하면 진행 중인 나머지 잡을 즉시 취소합니다. 잡 이름은 필수 상태 체크 이름과 같아야 합니다.
    name: ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Build
            target: build
            timeout: 20
          - name: Test
            target: test
            timeout: 30
    steps:
      - uses: actions/checkout@v5

      - name: ${{ matrix.name }}
        run: make ${{ matrix.target }} XCODEBUILD_FLAGS=-skipMacroValidation
